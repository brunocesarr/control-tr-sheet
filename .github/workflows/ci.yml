name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Next 16 requires >= 20.9; import.meta.dirname requires >= 20.11.
  # 22 LTS satisfies both.
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      # Order matters: pnpm must exist before setup-node can use `cache: pnpm`.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm blocks dependency build scripts by default. If `allowBuilds` in
      # pnpm-workspace.yaml is wrong, install still SUCCEEDS but Tailwind emits
      # near-empty CSS and Vitest cannot start. Fail loudly here instead.
      - name: Assert native binaries were built
        run: |
          set -e
          node -e "require.resolve('@tailwindcss/oxide')" \
            && echo "✅ @tailwindcss/oxide resolved"
          pnpm exec esbuild --version > /dev/null \
            && echo "✅ esbuild binary present"
          if pnpm install --frozen-lockfile 2>&1 | grep -q "Ignored build scripts"; then
            echo "::error::Build scripts were ignored — check allowBuilds in pnpm-workspace.yaml"
            exit 1
          fi
          echo "✅ No ignored build scripts"

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:run
        env:
          JWT_SECRET: ci-only-secret-value-at-least-32-chars-long

      - name: Build
        run: pnpm run build
        env:
          # Placeholders only — no real credentials needed to compile.
          NEXT_PUBLIC_APP_WRITE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_URL_AMBIENTE_SERVER: http://localhost:3000
          NEXT_PUBLIC_AMBIENTE_TR_MANAGER_WEB_APP: ci
          NEXT_PUBLIC_STORAGE_OBFUSCATION_KEY: ci-placeholder
          JWT_SECRET: ci-only-secret-value-at-least-32-chars-long
          GOOGLE_SERVICE_SHEET_ID: ci-placeholder
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ci@placeholder.iam.gserviceaccount.com
          GOOGLE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nci\n-----END PRIVATE KEY-----\n"

      - name: Assert no server secret in the client bundle
        # Regression guard for the next.config.ts `env` leak. A known-value
        # secret is used above precisely so this grep is meaningful.
        run: |
          if grep -rl "ci-only-secret-value" .next/static 2>/dev/null; then
            echo "::error::JWT_SECRET leaked into the client bundle."
            exit 1
          fi
          echo "✅ No server secret in .next/static"

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
        continue-on-error: true
