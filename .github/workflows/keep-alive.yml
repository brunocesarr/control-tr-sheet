name: Keep Appwrite Active

on:
  schedule:
    # Every 3 days at 04:17 UTC.
    #
    # Appwrite Cloud pauses free-tier projects after 7 days of inactivity, so a
    # 3-day cadence gives two chances to land before the deadline — one missed
    # run is survivable.
    #
    # 04:17 rather than 04:00: GitHub delays cron heavily at the top of the
    # hour when everyone schedules at once. An offset minute runs closer to time.
    - cron: '17 4 */3 * *'

  # Manual trigger, so a paused project can be revived on demand.
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # only to open a failure notification

jobs:
  ping:
    name: Ping keep-alive endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping production keep-alive
        id: ping
        env:
          # Full production URL, e.g. https://control-tr-sheet.vercel.app
          APP_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing PRODUCTION_URL or CRON_SECRET repository secret."
            exit 1
          fi

          endpoint="${APP_URL%/}/api/v1/cron/keep-alive"
          echo "Pinging ${endpoint}"

          # Retry 3 times with backoff. A single cold-start timeout should not
          # burn an entire 3-day window.
          attempt=1
          max_attempts=3

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "── Attempt ${attempt}/${max_attempts} ──"

            http_code=$(curl \
              --silent \
              --show-error \
              --location \
              --max-time 45 \
              --write-out '%{http_code}' \
              --output response.json \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --header 'Accept: application/json' \
              "${endpoint}" || echo '000')

            echo "HTTP ${http_code}"
            [ -f response.json ] && cat response.json && echo ""

            if [ "$http_code" = "200" ]; then
              echo "✅ Appwrite heartbeat succeeded — inactivity timer reset."
              exit 0
            fi

            # 401 is a config error, not a transient failure. Retrying is futile.
            if [ "$http_code" = "401" ]; then
              echo "::error::401 Unauthorized — CRON_SECRET in GitHub does not match Vercel."
              exit 1
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 20))
              echo "Retrying in ${delay}s…"
              sleep "$delay"
            fi

            attempt=$((attempt + 1))
          done

          echo "::error::Keep-alive failed after ${max_attempts} attempts (last HTTP ${http_code})."
          exit 1

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 Appwrite keep-alive failed';

            // Reuse an existing open issue instead of spamming a new one
            // every 3 days.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'keep-alive',
            });

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled Appwrite keep-alive ping failed.`,
              ``,
              `**Run:** ${runUrl}`,
              `**When:** ${new Date().toISOString()}`,
              ``,
              `### Why this matters`,
              `Appwrite Cloud pauses free-tier projects after **7 days** of inactivity.`,
              `A paused project blocks all logins and is **deleted after 90 days**.`,
              ``,
              `### Checklist`,
              `- [ ] Is the production deployment live?`,
              `- [ ] Does \`CRON_SECRET\` match between GitHub secrets and Vercel env vars?`,
              `- [ ] Is \`PRODUCTION_URL\` correct (no trailing slash, includes https://)?`,
              `- [ ] Check https://status.appwrite.io`,
              `- [ ] Open the Appwrite Console — that alone reactivates a paused project.`,
            ].join('\n');

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['keep-alive', 'bug'],
              });
            }
